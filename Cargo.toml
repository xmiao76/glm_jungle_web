[workspace]
members = ["crates/jungle-core", "crates/jungle-app", "crates/jungle-worker"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
jungle-core = { path = "crates/jungle-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
